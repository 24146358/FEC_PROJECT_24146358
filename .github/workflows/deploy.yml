name: Deploy Lambda Functions

on:
  push:
    branches: [main]
    paths:
      - 'backend/lambda_ingest.py'
      - 'backend/lambda_read.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-1

      - name: Deploy IoTIngest Lambda
        run: |
          cd backend
          zip ingest.zip lambda_ingest.py
          aws lambda update-function-code \
            --function-name IoTIngest \
            --zip-file fileb://ingest.zip

      - name: Deploy IoTRead Lambda
        run: |
          cd backend
          zip read.zip lambda_read.py
          aws lambda update-function-code \
            --function-name IoTRead \
            --zip-file fileb://read.zip